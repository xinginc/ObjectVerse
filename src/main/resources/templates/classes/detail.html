<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${oopClass.className} + ' - ObjectVerse 类设计器'">类详情 - ObjectVerse</title>
    <link rel="stylesheet" href="/css/objectverse.css?v=unified-gap-48-20260630-1">
</head>
<body>
<nav th:replace="~{fragments/sidebar :: sidebar('projects')}"></nav>
<main class="page-shell">
    <section class="page-header">
        <div>
            <p class="section-label">Class Detail</p>
            <h1 th:text="${oopClass.className}">Course</h1>
            <p class="page-description">查看当前类抽象的名称、包结构、访问边界和职责说明。</p>
        </div>
        <div class="header-actions">
            <a class="secondary-link" th:href="@{/projects/{projectId}/classes(projectId=${projectId})}">返回类列表</a>
            <a class="primary-link" th:href="@{/projects/{projectId}/classes/{classId}/attributes(projectId=${projectId}, classId=${oopClass.id})}">管理属性</a>
            <a class="primary-link" th:href="@{/projects/{projectId}/classes/{classId}/methods(projectId=${projectId}, classId=${oopClass.id})}">管理方法</a>
            <a class="primary-link" th:href="@{/projects/{projectId}/classes/{classId}/edit(projectId=${projectId}, classId=${oopClass.id})}">编辑类</a>
        </div>
    </section>

    <section class="detail-section">
        <dl class="detail-grid">
            <div>
                <dt>类名</dt>
                <dd th:text="${oopClass.className}">Course</dd>
            </div>
            <div>
                <dt>包名</dt>
                <dd th:text="${oopClass.packageName}">com.example.objectverse.domain</dd>
            </div>
            <div>
                <dt>访问修饰符</dt>
                <dd><span class="status-badge" th:text="${oopClass.visibility}">PUBLIC</span></dd>
            </div>
            <div>
                <dt>是否抽象类</dt>
                <dd th:text="${oopClass.isAbstract} ? '是' : '否'">否</dd>
            </div>
            <div>
                <dt>创建时间</dt>
                <dd th:text="${#temporals.format(oopClass.createTime, 'yyyy-MM-dd HH:mm')}">2026-06-05 20:30</dd>
            </div>
            <div class="full-row">
                <dt>类说明</dt>
                <dd th:text="${oopClass.description}">说明这个类在当前项目中的职责和封装边界。</dd>
            </div>
        </dl>
    </section>
</main>
</body>
</html>
