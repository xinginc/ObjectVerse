<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ObjectVerse</title>
    <link rel="stylesheet" href="/css/objectverse.css?v=auth-copy-20260630-1">
</head>
<body>
<nav th:replace="~{fragments/sidebar :: sidebar('')}"></nav>
<main class="auth-container">
    <section class="soft-card auth-card">
        <div class="auth-brand-panel">
            <p class="course-label">ObjectVerse Account</p>
            <h1>欢迎回到 ObjectVerse</h1>
            <p>ObjectVerse 是面向 Java 面向对象课程的项目建模与学习平台，支持需求构思、类与关系建模、UML 类图展示、代码生成、代码审查和学习笔记交流。</p>
            <div class="chip-list">
                <span>需求构思</span>
                <span>UML 建模</span>
                <span>代码审查</span>
            </div>
        </div>
        <div class="auth-form-panel">
            <div class="section-heading">
                <p class="section-label">Login</p>
                <h2>登录</h2>
            </div>
            <p class="error-message" th:if="${errorMessage != null}" th:text="${errorMessage}">错误信息</p>
            <form class="project-form" action="/login" method="post">
                <label class="full-row">
                    用户名
                    <input type="text" name="username" th:value="${username}" required>
                </label>
                <label class="full-row">
                    密码
                    <input type="password" name="password" required>
                </label>
                <div class="form-actions">
                    <button type="submit">登录</button>
                    <a href="/register">没有账号，去注册</a>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
