server:
  port: 8081
  tomcat:
    max-http-form-post-size: 30MB

spring:
  application:
    name: objectverse
  web:
    resources:
      chain:
        cache: false
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/objectverse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:objectverse_user}
    password: ${DB_PASSWORD:}
  thymeleaf:
    cache: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.objectverse.entity
  configuration:
    map-underscore-to-camel-case: true

ai:
  provider: qwen
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  api-key: ${DASHSCOPE_API_KEY:}
